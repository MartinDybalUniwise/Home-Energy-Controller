[tool.pytest.ini_options]
testpaths = ["dev/hec/tests"]
pythonpath = ["dev", "."]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: browser smoke tests requiring a running safe preview",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# Prototypy v kořeni jsou zmrazené (CLAUDE.md, pravidlo 1) – lint je nepřepisuje.
exclude = ["data", "logs", "history", "tng_controller.py", "ote_reader.py",
           "weather_reader.py", "goodwe-read.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
