<!DOCTYPE html>
<html lang="cs" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>Home Energy Controller</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css?v=13">
</head>
<body>
<div id="scene" class="scene" aria-hidden="true"></div>

<header class="topbar">
  <button id="menu-toggle" class="icon-button" aria-expanded="false" aria-controls="nav">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    <span class="sr-only" data-i18n="nav.menu">Menu</span>
  </button>
  <h1 id="site-name" class="site-name">Home Energy Controller</h1>
  <div class="topbar-status">
    <span id="status-pill" class="pill" hidden></span>
    <span id="clock" class="clock"></span>
    <button id="more-toggle" class="more-button" type="button" aria-expanded="false" aria-controls="utility-nav" data-i18n="nav.more">Více</button>
  </div>
</header>

<nav id="nav" class="nav">
  <a href="#/overview"   data-page="overview"   data-i18n="nav.today">Dnes</a>
  <a href="#/prediction" data-page="prediction" data-i18n="nav.forecast">Výhled</a>
  <a href="#/flow"       data-page="flow"       data-i18n="nav.flow">Tok energie</a>
  <a href="#/history"    data-page="history"    data-i18n="nav.history">Historie</a>
</nav>
<nav id="utility-nav" class="utility-nav" hidden aria-label="Advanced navigation">
  <p data-i18n="nav.advanced">Servis a diagnostika</p>
  <a href="#/settings" data-page="settings" data-i18n="nav.settings">Nastavení</a>
  <a href="#/status" data-page="status" data-i18n="nav.status">Stav</a>
  <a href="#/logs" data-page="logs" data-i18n="nav.logs">Data</a>
</nav>

<main id="view" class="view" tabindex="-1">
  <p class="loading" data-i18n="app.loading">Načítám…</p>
</main>

<dialog id="login">
  <form method="dialog" id="login-form">
    <h2 data-i18n="login.title">Přihlášení</h2>
    <label for="login-password" data-i18n="login.password">Heslo</label>
    <input id="login-password" type="password" autocomplete="current-password" required>
    <p id="login-error" class="error" hidden data-i18n="login.failed">Nesprávné heslo</p>
    <button value="submit" data-i18n="login.submit">Přihlásit</button>
  </form>
</dialog>

<script type="module" src="/js/app.js?v=11"></script>
</body>
</html>
