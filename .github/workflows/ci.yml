name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -m "not e2e"

  sdd-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python dev/sdd/tools/validate_step.py
      - run: python dev/sdd/tools/validate_changed_steps.py --base "${{ github.event.pull_request.base.sha || github.event.before }}" --head "${{ github.sha }}"
      - run: python dev/sdd/tools/validate_repo.py
      - run: python dev/sdd/tools/full_validation.py
